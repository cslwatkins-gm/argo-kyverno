apiVersion: v1
kind: Pod
metadata:
  name: test-resources
  labels:
    environment: test
spec:
  containers:
    - name: busybox
      image: busybox
      command: ["sleep", "3600"]
  ignoreDifferences:
    - group: ""
      kind: Pod
      jsonPointers:
        - /metadata/labels/policies.kyverno.io~1managed
        - /metadata/annotations/policies.kyverno.io~1last-applied
      jqPathExpressions:
        - .spec.template.metadata.labels | to_entries[] | select(.key | startswith("policies.kyverno.io"))
